services:
  - type: web
    name: uravu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && flask --app app init-db
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true   # signs the login cookie; Render makes a random one
      - key: OWNER_EMAIL
        sync: false   # your email: trees made before logins are given to this account
      - key: GOOGLE_CLIENT_ID
        sync: false   # from Google Cloud Console > Credentials (leave empty to hide the Google button)
      - key: GOOGLE_CLIENT_SECRET
        sync: false
