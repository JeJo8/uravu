services:
  - type: web
    name: uravu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && flask --app app init-db
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.12.7
