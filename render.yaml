# Render Static Site: plain files, so it never sleeps.
# The browser talks straight to Neon (Auth + Data API); security rules live in db/setup.sql.
services:
  - type: web
    name: uravu
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_NEON_DATA_API_URL
        sync: false   # Neon Console > Data API: https://ep-....apirest....neon.tech/neondb/rest/v1
    routes:
      # Neon Auth served from this site, so Safari accepts the sign-in cookie.
      # Change the destination if you move to another Neon project (Neon Console > Auth URL).
      - type: rewrite
        source: /api/auth/*
        destination: https://ep-aged-flower-za5m9r45.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth/*
      - type: rewrite
        source: /login
        destination: /auth.html
      - type: rewrite
        source: /signup
        destination: /auth.html
      - type: rewrite
        source: /join/*
        destination: /auth.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin   # keeps invite links out of other sites' logs
