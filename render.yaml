# Render Static Site: plain files, so it never sleeps.
# The browser talks straight to Neon (Auth + Data API); security rules live in db/setup.sql.
services:
  - type: web
    name: uravu
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_NEON_AUTH_URL     # Neon Console > Auth URL (public)
        value: https://ep-aged-flower-za5m9r45.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth
      - key: VITE_NEON_DATA_API_URL
        sync: false   # Neon Console > Data API: https://ep-....apirest....neon.tech/neondb/rest/v1
    routes:
      - type: rewrite
        source: /login
        destination: /auth.html
      - type: rewrite
        source: /signup
        destination: /auth.html
      - type: rewrite
        source: /join/*
        destination: /auth.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin   # keeps invite links out of other sites' logs
      - path: /sw.js
        name: Cache-Control
        value: no-cache                       # phones pick up new versions straight away
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable   # file names change on every build
